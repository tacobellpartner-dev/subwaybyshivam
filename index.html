<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Franchise Enquiry Form</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.form-container{
    width:100%;
    max-width:600px;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 20px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    color:#008938;
}

input,
select,
textarea{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:5px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    background:#008938;
    color:#fff;
    font-size:18px;
    border-radius:5px;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="form-container">

<h2>Franchise Enquiry Form</h2>

<form action="https://api.web3forms.com/submit" method="POST">

    <!-- Replace with your actual Web3Forms Access Key -->
    <input type="hidden" name="access_key" value="712e4d6f-840f-4b5c-bee2-803f5061a9ba">

    <input type="hidden" name="subject" value="New Franchise Enquiry">

    <input type="text" name="name" placeholder="Full Name" required>

    <input type="email" name="email" placeholder="Email Address" required>

    <input type="tel" name="phone" placeholder="Mobile Number" required>

    <input type="text" name="city" placeholder="City" required>

    <select name="experience" required>
        <option value="">Business Experience</option>
        <option>0-1 Year</option>
        <option>1-3 Years</option>
        <option>3-5 Years</option>
        <option>5+ Years</option>
    </select>

    <textarea name="message" rows="5" placeholder="Preferred Location & Details"></textarea>

    <button type="submit">Submit Application</button>

</form>

</div>

</body>
</html>
